name = "S13"
version = "0.1.0"
defaultTargets = ["S13"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The computation (core Lean only), compiled to native code so that `native_decide` runs it natively.
[[lean_lib]]
name = "S13Comp"
precompileModules = true

[[lean_lib]]
name = "S13"

[[lean_exe]]
name = "bench"
root = "Bench"
srcDir = "bench"

[[lean_exe]]
name = "crosscheck"
root = "CrossCheck"
srcDir = "crosscheck"

[[lean_lib]]
name = "S11Comp"
precompileModules = true

# Build-time loader of certificate data.
[[lean_lib]]
name = "S11Loader"
precompileModules = true

# Small certificates (5 to 9 channels) for testing the pipeline.
[[lean_lib]]
name = "S11Small"
globs = ["S11Small", "S11Small.+"]
precompileModules = true

# The certificate data for `S(11) ≥ 35` (generated by scripts/s11_data.sh), compiled to native code.
[[lean_lib]]
name = "S11Data"
globs = ["S11Data", "S11Data.+"]
precompileModules = true
# 2.2 GB of string data: the medium code model addresses large data sections with 64-bit offsets.
moreLeancArgs = ["-mcmodel=medium"]

[[lean_exe]]
name = "s11bench"
root = "S11Bench"
srcDir = "bench"

[[lean_exe]]
name = "s11prof"
root = "S11Prof"
srcDir = "bench"

[[lean_exe]]
name = "s11neg"
root = "S11Neg"
srcDir = "bench"
